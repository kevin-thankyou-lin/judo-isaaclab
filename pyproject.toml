[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "judo-isaaclab"
version = "0.1.0"
description = "History-conditioned IsaacLab rollout backend for MPC"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "judo-rai>=0.1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
collision-screening = [
    "python-fcl>=0.7.0.8",
    "scipy>=1.10",
    "trimesh>=4.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/judo_isaaclab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
